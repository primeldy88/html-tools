version: '3.8'
services:
  html-tools:
    image: ghcr.io/primeldy88/html-tools:latest
    container_name: html-tools
    ports:
      - "5000:5000"
    environment:
      - ADMIN_PASSWORD=admin123
      - NAVBAR_TITLE=LDY Tools Portal
      - PORTAL_COLOR=#3b82f6
    volumes:
      - ./data:/app/tools
    restart: unless-stopped
