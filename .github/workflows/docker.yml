name: Build and Push Docker Image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug - show files
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== LS ==="
          ls -la

      - name: Build and push
        run: |
          docker build -t ghcr.io/${{ github.repository }}/html-tools:latest .
          docker push ghcr.io/${{ github.repository }}/html-tools:latest
